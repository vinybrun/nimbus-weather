<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Nimbus is a calm weather app. Search any city or use your location for current conditions and a 7-day forecast."
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="Nimbus — Weather" />
    <meta
      property="og:description"
      content="Search any city or use your location for current conditions and a 7-day forecast."
    />
    <meta property="og:type" content="website" />
    <title>Nimbus — Weather</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-atmosphere="clear-day">
    <div class="sky" aria-hidden="true">
      <div class="orb"></div>
      <div class="haze"></div>
    </div>
    <div class="grain" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Nimbus home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-copy">
            <span class="brand-name">Nimbus</span>
            <span class="brand-tag">A quiet look at the sky</span>
          </span>
        </a>
        <div class="unit-toggle" role="group" aria-label="Temperature unit">
          <button type="button" id="unit-c" aria-pressed="true">°C</button>
          <button type="button" id="unit-f" aria-pressed="false">°F</button>
        </div>
      </header>

      <form class="search" id="search-form" autocomplete="off" role="search">
        <label class="sr-only" for="city-input">Search city</label>
        <div class="search-field">
          <svg class="search-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75" />
            <path d="M16 16.5 20.5 21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          </svg>
          <input
            id="city-input"
            name="city"
            type="search"
            placeholder="Search a city — Lisbon, Kyoto, Reykjavík"
            maxlength="80"
            spellcheck="false"
            enterkeyhint="search"
            aria-autocomplete="list"
            aria-controls="suggestions"
            aria-expanded="false"
            role="combobox"
          />
          <button type="submit" class="search-go">Search</button>
          <button type="button" class="locate" id="locate-btn" aria-label="Use my location">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" fill="currentColor" />
              <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <span class="locate-label">Near me</span>
          </button>
        </div>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <main id="app" class="app">
        <section class="empty" id="empty-state">
          <p class="empty-kicker">Observatory</p>
          <h1>Look up any sky.</h1>
          <p>
            Search a city, or share your location for current temperature, wind, humidity, and a seven-day
            outlook. No account. No API key.
          </p>
          <div class="chips" aria-label="Suggested cities">
            <button type="button" class="chip" data-city="Lisbon">Lisbon</button>
            <button type="button" class="chip" data-city="Kyoto">Kyoto</button>
            <button type="button" class="chip" data-city="Reykjavík">Reykjavík</button>
            <button type="button" class="chip" data-city="São Paulo">São Paulo</button>
          </div>
        </section>
      </main>

      <footer class="foot">
        <p>
          Forecasts from
          <a href="https://open-meteo.com/" rel="noopener noreferrer" target="_blank">Open-Meteo</a>
          · WMO weather codes · Units convert locally
        </p>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
